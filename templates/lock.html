            "on-primary-fixed": "#291800",
            "on-secondary": "#003733",
            "secondary-fixed": "#69f8ea",
            "on-error": "#690005",
            "secondary-fixed-dim": "#45dccd",
            "primary": "#ffc880",
            "on-secondary-fixed": "#00201d",
            "error": "#ffb4ab",

  <style>
    body {
      background-color: #0A0A0C;
      overflow: hidden;
      height: 100vh;
    }

    .vignette {
      background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.8) 100%);
      pointer-events: none;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .timer-ring {
      transform: rotate(-90deg);
    }

    .timer-glow {
      filter: drop-shadow(0 0 16px rgba(245, 166, 35, 0.4));
    }

    .lock-glow {
      filter: drop-shadow(0 0 8px rgba(245, 166, 35, 0.6));
    }
  </style>
  <style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>

<body class="flex flex-col items-center justify-between py-16 px-8 relative">
  <!-- Vignette Overlay -->
  <div class="absolute inset-0 vignette z-10"></div>
  <!-- Top Content: Brand Identity / Context -->
  <header class="z-20 flex flex-col items-center space-y-4">
    <div class="lock-glow flex items-center justify-center">
      <span class="material-symbols-outlined text-primary-container text-3xl"
        style="font-variation-settings: 'FILL' 1;">
        lock_clock
      </span>
    </div>
    <div class="text-center space-y-1">
      <p class="font-body text-[10px] tracking-[0.2em] text-[#8A8A9A] uppercase font-semibold">
        FOCUS SESSION ACTIVE
      </p>
      <h1 class="font-headline text-[18px] text-[#8A8A9A] font-normal tracking-tight">
        Deep Work Block #1
      </h1>
    </div>
  </header>
  <!-- Central Instrument: Countdown Timer -->
  <main class="z-20 relative flex items-center justify-center">
    <!-- Progress Ring Container -->
    <div class="relative w-[300px] h-[300px] flex items-center justify-center">
      <svg class="timer-ring w-full h-full" viewbox="0 0 100 100">
        <!-- Track -->
        <circle cx="50" cy="50" fill="none" r="46" stroke="#2A2A35" stroke-width="2"></circle>
        <!-- Progress (34%) -->
        <circle class="timer-glow" cx="50" cy="50" fill="none" r="46" stroke="#F5A623" stroke-dasharray="289"
          stroke-dashoffset="190.74" stroke-linecap="round" stroke-width="2"></circle>
      </svg>
      <!-- Timer Text -->
      <div class="absolute inset-0 flex flex-col items-center justify-center">
        <span id="timerText" class="font-mono text-[88px] text-[#F2F2F5] leading-none tracking-tighter">
          32:14
        </span>
      </div>
    </div>
    <!-- Motivational Line Positioned below the ring -->
    <div class="absolute -bottom-16 left-0 right-0 text-center">
      <p class="font-body text-xs text-[#8A8A9A]/60 italic">
        You're 34% through your Deep Work Block
      </p>
    </div>
  </main>
  <!-- Footer Meta-info -->
  <footer class="z-20 w-full flex flex-col items-center">
    <div class="flex flex-col items-center space-y-2">
      <!-- Focus Pulse Component -->
      <div class="flex items-center space-y-1">
        <div class="w-1.5 h-1.5 rounded-full bg-secondary shadow-[0_0_8px_rgba(61,214,200,0.6)] animate-pulse"></div>
      </div>
      <p class="font-body text-[10px] text-[#44444F] tracking-wide text-center">
        Locked until 5:00 PM · Set from MacBook Pro
      </p>
    </div>
    <!-- Bottom Safety Margin for Gestures -->
    <div class="h-6"></div>
  </footer>
  <!-- Ambient Texture Layer -->
  <div class="absolute inset-0 z-0 opacity-[0.03] pointer-events-none"
    data-alt="subtle grainy texture overlay to simulate high-end display material and cinematic depth"
    style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCMy6ekwnTFjZIGxgCQi2fxIwLjR8RPduheZlNA3kA9ne_U4qx5iobHQzUHK338cuK5ckpb17Hr4PW6xyLQEzBnDKbc1QgxPwVVJBW8T0U_R8l9zujvObkC22qFdwcEOxn3f1cbbkO3unHVI3PGCmQmj6Jg1v4XARAvyBcZblKlM29W9O0C9vIfyCZJVSOEzYa6qesawEhQIhf6gSK5o8rvv78BtcxuBiXfMlkLZloz4fwmhAD2UdfiH2sAWTvqTe8GpnbHlecN5s0');">
  </div>
  <script>
    async function checkStatus() {
      try {
        const r = await fetch('/status');
        const data = await r.json();
        if (data.mode !== 'lock') {
          // Time up or manually unlocked! Redirect to Celebration
          window.location.replace('/mobile_celeb');
          return;
        }
        const remaining = data.seconds_remaining;
        const m = Math.floor(remaining / 60).toString().padStart(2, '0');
        const s = (remaining % 60).toString().padStart(2, '0');
        const t = document.getElementById('timerText');
        if (t) t.innerText = `${m}:${s}`;
      } catch (e) { console.error('Error fetching status', e); }
    }
    setInterval(checkStatus, 1000);
    checkStatus();
  </script>
</body>

</html>
