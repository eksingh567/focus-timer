<body class="bg-background text-on-background font-geist selection:bg-primary selection:text-on-primary min-h-screen flex flex-col items-center justify-center overflow-hidden">
<!-- Radial Background Glow -->
<div class="fixed inset-0 glow-overlay pointer-events-none"></div>
<!-- Top Navigation (Conditional Suppression logic applied) -->
<!-- Suppressing full TopAppBar as this is a transactional focus-complete screen, but rendering brand anchor -->
<header class="fixed top-0 w-full flex justify-between items-center px-6 py-8 z-50">
<div class="font-syne font-extrabold text-primary uppercase tracking-tighter text-xl">FocusLock</div>
<button class="text-zinc-500 hover:text-primary transition-colors duration-200">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-md px-8 flex flex-col items-center text-center">
<!-- Centerpiece: Checkmark with Pulse -->
<div class="relative mb-10">
<div class="absolute inset-0 bg-secondary/20 blur-3xl rounded-full scale-150 animate-pulse"></div>
<div class="relative w-24 h-24 rounded-full border-2 border-secondary/30 flex items-center justify-center bg-surface-container-low">
<span class="material-symbols-outlined text-6xl text-secondary" style="font-variation-settings: 'wght' 600;">check_circle</span>
</div>
</div>
<!-- Heading Group -->
<div class="space-y-3 mb-10">
<h1 class="font-syne font-bold text-4xl tracking-tight text-slate-100 uppercase">SESSION COMPLETE</h1>
<p class="font-mono text-primary text-lg tracking-wide">You locked in for 45:00</p>
</div>
<!-- Stats Card -->
<div class="w-full cockpit-card border border-outline-variant rounded-2xl p-6 mb-8 text-left space-y-4 shadow-2xl">
<div class="flex justify-between items-center">
<div class="flex flex-col">
<span class="text-[10px] uppercase tracking-widest text-zinc-500 font-bold mb-1">Duration</span>
<span class="font-mono text-xl text-primary">45:00</span>
</div>
<div class="h-8 w-px bg-outline-variant/50"></div>
<div class="flex flex-col">
<span class="text-[10px] uppercase tracking-widest text-zinc-500 font-bold mb-1">Integrity</span>
<span class="font-mono text-xl text-secondary">100%</span>
</div>
</div>
<div class="pt-4 border-t border-outline-variant/30 space-y-3">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-zinc-400 text-sm">timer</span>
<span class="text-sm text-zinc-300">Focus time: <span class="text-on-background font-medium">45:00</span></span>
</div>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-zinc-400 text-sm">do_not_disturb_on</span>
<span class="text-sm text-zinc-300">Distractions: <span class="text-on-background font-medium">0 interruptions</span></span>
</div>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary text-sm" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="text-sm text-secondary font-medium uppercase tracking-wider">Streak updated!</span>
</div>
</div>
</div>
<!-- Milestone Callout -->
<div class="mb-12 flex flex-col items-center">
<div class="flex items-center gap-2 px-4 py-2 bg-primary/10 border border-primary/20 rounded-full mb-2">
<span class="text-primary text-lg">🔥</span>
<span class="font-geist font-bold text-primary text-sm uppercase tracking-wider">7-Day Streak!</span>
</div>
<p class="text-zinc-400 text-sm italic">You're on fire. Consistent performance detected.</p>
</div>
<!-- Action Area -->
<div class="w-full space-y-4">
<button class="w-full bg-gradient-to-br from-primary to-on-primary-fixed-variant text-on-primary font-syne font-extrabold py-4 rounded-xl shadow-lg active:scale-95 transition-all duration-200 tracking-wider">
                DONE
            </button>
<button class="w-full bg-transparent border border-outline-variant/40 text-primary font-syne font-bold py-4 rounded-xl hover:bg-white/5 transition-colors duration-200 tracking-wider">
                START ANOTHER
            </button>
</div>
</main>
